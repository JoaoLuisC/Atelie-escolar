name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Só `contents: read`: o job faz checkout e build. O status que ele publica no
# PR sai pelo LHCI_GITHUB_APP_TOKEN, que é um token próprio — o GITHUB_TOKEN
# não precisa de escrita aqui.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
