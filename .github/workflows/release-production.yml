name: Release production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma migration e um deploy em produção não podem concorrer: cada release deve
# terminar (ou falhar) antes de começar a seguinte.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mantém o gate de produção independente do workflow de CI geral:
      # somente código validado pode chegar à migration.
      - name: Validate application
        run: npm run check

  migrate_and_deploy:
    name: Migrate database and deploy
    needs: validate
    # Só é habilitado depois que todos os secrets e variáveis estiverem
    # cadastrados no repositório. Evita um push publicar parcialmente.
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure reviewers neste Environment no GitHub para aprovar toda
    # alteração de banco antes da publicação em produção.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O runner hospedado do GitHub não tem saída IPv6. A URL do Session
      # Pooler do Supabase fornece a conexão IPv4 necessária para migrations.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production build
        id: deploy
        shell: bash
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
