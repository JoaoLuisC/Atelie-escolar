<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Ateliê da Escola</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Raleway:wght@700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

  <!-- PAGE HEADER -->
  <section class="hero-animated products-page-header">
    <div class="hero-bg-gradient"></div>
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    <div class="hero-blob hero-blob-3"></div>
    <div class="hero-blob hero-blob-4"></div>
    <div class="hero-grid"></div>

    <div class="hero-school-icons" aria-hidden="true">
      <span class="school-icon school-icon-1">✏️</span>
      <span class="school-icon school-icon-2">📚</span>
      <span class="school-icon school-icon-3">🎨</span>
      <span class="school-icon school-icon-4">⭐</span>
      <span class="school-icon school-icon-5">📐</span>
      <span class="school-icon school-icon-6">🖍️</span>
      <span class="school-icon school-icon-7">📏</span>
      <span class="school-icon school-icon-8">🔢</span>
      <span class="school-icon school-icon-9">🌈</span>
      <span class="school-icon school-icon-10">🎒</span>
    </div>

    <div class="container hero-content">
      <div class="row align-items-center" style="min-height:30vh;padding:40px 0 44px;">
        <div class="col-lg-8">
          <h1 class="hero-title" style="font-size:clamp(1.8rem,4vw,2.8rem);">
            Banners para toda<br>
            <span class="highlight">ocasião escolar</span>
          </h1>
        </div>
      </div>
    </div>
  </section>

  <!-- SIDEBAR OVERLAY (mobile only) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- LAYOUT -->
  <div class="products-layout">

    <!-- SIDEBAR estático (esquerda) -->
    <aside class="products-sidebar" id="productsSidebar">

      <!-- Categorias -->
      <div class="sidebar-collapsible open">
        <button class="sidebar-section-toggle">Categorias <i class="bi bi-chevron-down"></i></button>
        <div class="sidebar-section-body" id="sidebarCatList">
          <button class="cat-btn sidebar-cat active" data-cat="all">
            Todos <span class="cat-count" id="cat-all">—</span>
          </button>
        </div>
      </div>

      <!-- Faixa de preço -->
      <div class="sidebar-collapsible open">
        <button class="sidebar-section-toggle">Faixa de preço <i class="bi bi-chevron-down"></i></button>
        <div class="sidebar-section-body">
          <label class="sidebar-radio"><input type="radio" name="price" value="all" checked> Todos</label>
          <label class="sidebar-radio"><input type="radio" name="price" value="0-25"> Até R$ 25</label>
          <label class="sidebar-radio"><input type="radio" name="price" value="25-50"> R$ 25 — R$ 50</label>
          <label class="sidebar-radio"><input type="radio" name="price" value="50+"> Acima de R$ 50</label>
        </div>
      </div>

    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="products-main">

      <!-- Barra superior: btn Filtros (mobile) + chips categorias destaque + ordenar por -->
      <div class="products-top-bar">
        <button class="btn-toggle-filters" id="toggleFilters">
          <i class="bi bi-sliders"></i> Filtros
        </button>
        <div class="cat-filter-bar" id="catFilterBar">
          <!-- chips de categorias em destaque injetados por products.js -->
        </div>
        <select id="sortSelect" class="sort-select-inline">
          <option value="newest">Mais recentes</option>
          <option value="price-asc">Menor preço</option>
          <option value="price-desc">Maior preço</option>
          <option value="name">Nome A-Z</option>
        </select>
      </div>

      <p class="results-count" id="resultsCount"></p>

      <!-- Loading -->
      <div id="loading" class="text-center py-5">
        <div class="spinner-border" style="color:var(--primary-color);" role="status"></div>
        <p class="mt-3 text-muted">Carregando produtos...</p>
      </div>

      <!-- Products Grid -->
      <div id="productsGrid" class="products-grid-new" style="display:none;"></div>

      <!-- Empty state -->
      <div id="emptyState" class="empty-state" style="display:none;">
        <i class="bi bi-search" style="font-size:2.5rem;color:var(--gray);"></i>
        <p>Nenhum produto encontrado nessa categoria.</p>
      </div>

      <!-- Error -->
      <div id="errorMessage" class="alert alert-danger" style="display:none;">
        Erro ao carregar produtos. Tente novamente.
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    const firebaseConfig = {
      apiKey: "AIzaSyCqbiSJXD02F0q9wFqrDAEKJtd6VHBjAOk",
      authDomain: "atelie-da-escola.firebaseapp.com",
      projectId: "atelie-da-escola",
      storageBucket: "atelie-da-escola.firebasestorage.app",
      messagingSenderId: "325690647064",
      appId: "1:325690647064:web:e1c3b4bfaaf921ab7cd96d"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const auth = getAuth(app);
    window.firebaseDb         = db;
    window.firebaseQuery      = query;
    window.firebaseCollection = collection;
    window.firebaseGetDocs    = getDocs;
    window.firebaseWhere      = where;

    // Carregar produtos comprados pelo usuário logado
    // Guard: lê o Firestore apenas UMA vez por sessão de página
    // (onAuthStateChanged pode disparar várias vezes: login inicial, renovação de token, etc.)
    window.purchasedProductIds = new Set();
    let _userProductsLoaded = false;

    onAuthStateChanged(auth, async user => {
      // Usuário deslogou → limpa badges sem nova leitura
      if (!user) {
        if (_userProductsLoaded) {
          window.purchasedProductIds = new Set();
          _userProductsLoaded = false;
          if (typeof renderProducts === 'function') renderProducts();
        }
        return;
      }

      // Já carregou para este usuário nesta sessão → ignora
      if (_userProductsLoaded) return;
      _userProductsLoaded = true;

      try {
        const snap = await getDoc(doc(db, 'userProducts', user.email));
        if (snap.exists()) {
          const ids = snap.data().productIds || [];
          window.purchasedProductIds = new Set(ids);
          // Só re-renderiza se os produtos já foram carregados (evita render vazio)
          if (typeof renderProducts === 'function' && typeof allProducts !== 'undefined' && allProducts.length > 0) {
            renderProducts();
          }
        }
      } catch (e) { console.warn('userProducts:', e.message); }
    });
  </script>

  <script src="/js/components.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
