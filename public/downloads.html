<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Downloads - Ateliê da Escola</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Raleway:wght@700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/footer.css">

    <style>
        .dl-page { padding: 60px 0; min-height: 70vh; background: #f5f7fa; }

        /* ── Cabeçalho usa paleta do site (roxo) ── */
        .dl-header {
            background: linear-gradient(135deg, #7A3DC0 0%, #9B5DE5 100%);
            color: #fff;
            padding: 36px 0 30px;
        }
        .dl-header h1 { font-family: 'Raleway', sans-serif; font-weight: 800; font-size: 1.8rem; margin: 0 0 4px; }
        .dl-header p  { margin: 0; opacity: .8; font-size: 14px; }

        /* ── Chip do usuário ── */
        .user-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,.15); border-radius: 40px;
            padding: 6px 14px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255,255,255,.25); margin-top: 12px;
        }
        .user-chip img { width: 24px; height: 24px; border-radius: 50%; }
        .btn-logout-sm {
            background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
            color: #fff; border-radius: 6px; padding: 4px 10px;
            font-size: 12px; cursor: pointer; margin-left: 8px;
            transition: background .2s;
        }
        .btn-logout-sm:hover { background: rgba(255,255,255,.25); }

        /* ── Cards de pedido ── */
        .order-card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 20px; overflow: hidden;
        }
        .order-card-head {
            background: linear-gradient(135deg, #7A3DC0 0%, #9B5DE5 100%);
            color: #fff;
            padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .order-card-head h5 { margin: 0; font-size: 15px; font-weight: 700; }

        /* ── Status pills ── */
        .status-pill {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: .03em;
        }
        .status-approved { background: #d4edda; color: #155724; }
        .status-pending   { background: #fff3cd; color: #856404; }
        .status-rejected  { background: #f8d7da; color: #721c24; }

        .order-card-body  { padding: 20px; }
        .download-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #f0e8ff;
        }
        .download-item:last-child { border-bottom: none; }

        /* ── Botão de download (roxo) ── */
        .btn-dl {
            background: linear-gradient(135deg, #9B5DE5 0%, #7A3DC0 100%);
            color: #fff; border: none; border-radius: 7px;
            padding: 8px 16px; font-size: 13px; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-flex;
            align-items: center; gap: 6px; transition: opacity .2s, transform .15s;
            white-space: nowrap;
        }
        .btn-dl:hover { opacity: .88; color: #fff; transform: translateY(-1px); }

        /* ── Estado vazio ── */
        .empty-dl {
            text-align: center; padding: 60px 20px;
            color: #9B5DE5;
        }
        .empty-dl i { font-size: 3rem; margin-bottom: 16px; }
        .empty-dl h4 { color: #7A3DC0; }

        /* ── Banner de sucesso pós-compra ── */
        #success-banner {
            display: flex; align-items: center; gap: 14px;
            background: linear-gradient(135deg, #1a7a4a 0%, #22a05e 100%);
            color: #fff; border-radius: 12px; padding: 18px 20px;
            margin-bottom: 24px; box-shadow: 0 4px 20px rgba(34,160,94,.35);
            animation: slideDown .4s ease;
        }
        .success-banner-icon { font-size: 2rem; flex-shrink: 0; }
        .success-banner-text { flex: 1; font-size: 15px; line-height: 1.5; }
        .success-banner-text strong { display: block; font-size: 17px; margin-bottom: 3px; }
        .success-banner-close {
            background: rgba(255,255,255,.2); border: none; color: #fff;
            border-radius: 6px; padding: 4px 8px; cursor: pointer;
            font-size: 14px; flex-shrink: 0; transition: background .2s;
        }
        .success-banner-close:hover { background: rgba(255,255,255,.35); }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <div class="dl-header">
        <div class="container">
            <h1><i class="bi bi-bag-heart"></i> Minhas Compras</h1>
            <p>Todos os seus produtos em um só lugar</p>
            <div id="user-chip-wrap"></div>
        </div>
    </div>

    <!-- Main -->
    <section class="dl-page">
        <div class="container">

            <!-- Loading auth -->
            <div id="loading-auth" class="text-center py-5">
                <div class="spinner-border" style="color:#9B5DE5;" role="status"></div>
                <p class="mt-3" style="color:#9B5DE5;">Verificando sessão…</p>
            </div>

            <!-- Content (shown after auth) -->
            <div id="dl-content" style="display:none;">

                <!-- Single order status (via URL ?order=xxx) -->
                <div id="order-status-wrap"></div>

                <!-- All past orders -->
                <div id="all-orders-wrap"></div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/cart.js"></script>
    <script type="module" src="/js/downloads.js"></script>
</body>
</html>
