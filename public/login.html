<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar / Cadastrar — Ateliê da Escola</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">

    <style>
        body {
            background: linear-gradient(135deg, #0D1B2A 0%, #1B263B 60%, #415A77 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .auth-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .auth-brand {
            background: linear-gradient(135deg, #0D1B2A 0%, #1B263B 100%);
            padding: 28px 32px 24px;
            text-align: center;
            color: #E0E1DD;
        }
        .auth-brand h1 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: .02em;
        }
        .auth-brand p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #778DA9;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #eef0f4;
        }
        .auth-tab {
            flex: 1;
            padding: 14px 0;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            font-size: 15px;
            font-weight: 600;
            color: #778DA9;
            cursor: pointer;
            transition: color .2s, border-color .2s;
        }
        .auth-tab.active {
            color: #415A77;
            border-bottom-color: #415A77;
        }

        .auth-body {
            padding: 28px 32px 32px;
        }

        .auth-panel { display: none; }
        .auth-panel.active { display: block; }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #1B263B;
            margin-bottom: 6px;
        }
        .form-control {
            border: 2px solid #dde2ea;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: #415A77;
            box-shadow: 0 0 0 3px rgba(65,90,119,.12);
            outline: none;
        }

        .btn-auth-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #415A77 0%, #1B263B 100%);
            color: #E0E1DD;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s, transform .2s;
        }
        .btn-auth-primary:hover {
            opacity: .92;
            transform: translateY(-1px);
        }
        .btn-auth-primary:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-google {
            width: 100%;
            padding: 11px;
            background: #fff;
            color: #3c4043;
            border: 2px solid #dde2ea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .2s, border-color .2s, box-shadow .2s;
        }
        .btn-google:hover {
            background: #f7f8fa;
            border-color: #415A77;
            box-shadow: 0 2px 8px rgba(65,90,119,.15);
        }
        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #aab0ba;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eef0f4;
        }

        .auth-alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .auth-alert.error   { background: #fde8e8; color: #a11; border: 1px solid #f5c6c6; }
        .auth-alert.success { background: #e6f4ea; color: #155724; border: 1px solid #c3e6cb; }
        .auth-alert.show { display: block; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #778DA9;
            text-decoration: none;
        }
        .back-link:hover { color: #415A77; }

        .password-wrap {
            position: relative;
        }
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #778DA9;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }
    </style>
</head>
<body>

<!-- Ícones escolares flutuantes -->
<div class="hero-school-icons" aria-hidden="true">
    <span class="school-icon school-icon-1">✏️</span>
    <span class="school-icon school-icon-2">📚</span>
    <span class="school-icon school-icon-3">🎨</span>
    <span class="school-icon school-icon-4">⭐</span>
    <span class="school-icon school-icon-5">📐</span>
    <span class="school-icon school-icon-6">🖍️</span>
    <span class="school-icon school-icon-7">📏</span>
    <span class="school-icon school-icon-8">🔢</span>
    <span class="school-icon school-icon-9">🌈</span>
    <span class="school-icon school-icon-10">🎒</span>
</div>

<div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
        <h1>🎨 Ateliê da Escola</h1>
        <p>Materiais gráficos para educação</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
        <button class="auth-tab active" data-panel="login">Entrar</button>
        <button class="auth-tab" data-panel="register">Cadastrar</button>
    </div>

    <div class="auth-body">

        <!-- Alert global -->
        <div id="auth-alert" class="auth-alert"></div>

        <!-- ── PAINEL LOGIN ── -->
        <div id="panel-login" class="auth-panel active">

            <button class="btn-google mb-3" id="btn-google-login">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Entrar com Google
            </button>

            <div class="divider">ou</div>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="login-email">E-mail</label>
                    <input class="form-control" type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="login-password">Senha</label>
                    <div class="password-wrap">
                        <input class="form-control" type="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-pw" data-target="login-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth-primary" id="btn-login-submit">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm"></span> Entrando…</span>
                </button>
            </form>
        </div>

        <!-- ── PAINEL CADASTRO ── -->
        <div id="panel-register" class="auth-panel">

            <button class="btn-google mb-3" id="btn-google-register">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Cadastrar com Google
            </button>

            <div class="divider">ou</div>

            <form id="form-register" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="reg-name">Nome completo</label>
                    <input class="form-control" type="text" id="reg-name" placeholder="Seu nome" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="reg-email">E-mail</label>
                    <input class="form-control" type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="reg-password">Senha</label>
                    <div class="password-wrap">
                        <input class="form-control" type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="toggle-pw" data-target="reg-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="reg-password2">Confirmar senha</label>
                    <div class="password-wrap">
                        <input class="form-control" type="password" id="reg-password2" placeholder="Repita a senha" required>
                        <button type="button" class="toggle-pw" data-target="reg-password2">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-auth-primary" id="btn-register-submit">
                    <span class="btn-text">Criar conta</span>
                    <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm"></span> Criando…</span>
                </button>
            </form>
        </div>

        <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Voltar à loja</a>
    </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signInWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged,
    signOut
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {
    getFirestore, doc, setDoc, getDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyCqbiSJXD02F0q9wFqrDAEKJtd6VHBjAOk",
    authDomain: "atelie-da-escola.firebaseapp.com",
    projectId: "atelie-da-escola",
    storageBucket: "atelie-da-escola.firebasestorage.app",
    messagingSenderId: "325690647064",
    appId: "1:325690647064:web:e1c3b4bfaaf921ab7cd96d"
};

const ADMIN_EMAIL = 'admin@ateliedaescola.com';

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();

/* Redirect if already logged in (ignora admin — ele pode fazer login como cliente) */
onAuthStateChanged(auth, async user => {
    if (!user) return;
    if (user.email === ADMIN_EMAIL) {
        /* Admin na página de login da loja: desloga para permitir entrar como cliente */
        await signOut(auth);
        return;
    }
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    window.location.href = redirect;
});

/* ── Helpers ── */
const alertEl = document.getElementById('auth-alert');

function showAlert(msg, type = 'error') {
    alertEl.textContent = msg;
    alertEl.className = `auth-alert ${type} show`;
    alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearAlert() {
    alertEl.className = 'auth-alert';
}

function setLoading(btn, loading) {
    btn.querySelector('.btn-text').classList.toggle('d-none', loading);
    btn.querySelector('.btn-loading').classList.toggle('d-none', !loading);
    btn.disabled = loading;
}

async function saveUserProfile(user, extraName) {
    const ref = doc(db, 'users', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
        const providers = user.providerData.map(p => p.providerId);
        await setDoc(ref, {
            uid:          user.uid,
            name:         user.displayName || extraName || '',
            email:        user.email,
            photoURL:     user.photoURL || '',
            provider:     providers.includes('google.com') ? 'google' : 'email',
            createdAt:    serverTimestamp(),
            purchases:    0
        });
    }
}

function redirectAfterLogin() {
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    window.location.href = redirect;
}

/* ── Tabs ── */
document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        clearAlert();
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.panel}`).classList.add('active');
    });
});

/* ── Toggle password ── */
document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.target);
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
});

/* ── Google Login / Register ── */
async function googleSignIn() {
    clearAlert();
    try {
        const result = await signInWithPopup(auth, provider);
        await saveUserProfile(result.user, null);
        redirectAfterLogin();
    } catch (err) {
        handleAuthError(err);
    }
}
document.getElementById('btn-google-login').addEventListener('click', googleSignIn);
document.getElementById('btn-google-register').addEventListener('click', googleSignIn);

/* ── Email Login ── */
document.getElementById('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    clearAlert();
    const btn   = document.getElementById('btn-login-submit');
    const email = document.getElementById('login-email').value.trim();
    const pw    = document.getElementById('login-password').value;

    if (!email || !pw) { showAlert('Preencha todos os campos.'); return; }

    setLoading(btn, true);
    try {
        await signInWithEmailAndPassword(auth, email, pw);
        redirectAfterLogin();
    } catch (err) {
        handleAuthError(err);
    } finally {
        setLoading(btn, false);
    }
});

/* ── Email Register ── */
document.getElementById('form-register').addEventListener('submit', async e => {
    e.preventDefault();
    clearAlert();
    const btn   = document.getElementById('btn-register-submit');
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pw    = document.getElementById('reg-password').value;
    const pw2   = document.getElementById('reg-password2').value;

    if (!name || !email || !pw || !pw2) { showAlert('Preencha todos os campos.'); return; }
    if (pw.length < 6)  { showAlert('A senha deve ter pelo menos 6 caracteres.'); return; }
    if (pw !== pw2)     { showAlert('As senhas não coincidem.'); return; }

    setLoading(btn, true);
    try {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        await updateProfile(cred.user, { displayName: name });
        await saveUserProfile(cred.user, name);
        showAlert('Cadastro realizado com sucesso! Redirecionando…', 'success');
        setTimeout(redirectAfterLogin, 1200);
    } catch (err) {
        handleAuthError(err);
    } finally {
        setLoading(btn, false);
    }
});

/* ── Error handler ── */
function handleAuthError(err) {
    const msgs = {
        'auth/user-not-found':     'E-mail não encontrado. Verifique ou crie uma conta.',
        'auth/wrong-password':     'Senha incorreta.',
        'auth/invalid-credential': 'E-mail ou senha inválidos.',
        'auth/email-already-in-use': 'Este e-mail já está cadastrado. Faça login.',
        'auth/weak-password':      'Senha fraca. Use pelo menos 6 caracteres.',
        'auth/invalid-email':      'E-mail inválido.',
        'auth/popup-closed-by-user': 'Login cancelado.',
        'auth/too-many-requests':  'Muitas tentativas. Tente novamente mais tarde.'
    };
    showAlert(msgs[err.code] || 'Ocorreu um erro. Tente novamente.');
    console.error(err);
}
</script>
</body>
</html>
