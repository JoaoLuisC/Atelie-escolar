<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ateliê da Escola</title>
    <meta
      name="description"
      content="Materiais educativos digitais — banners, painéis e atividades para professores."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes trim: só pesos efetivamente usados pela UI; display=swap evita FOIT/CLS. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Raleway:wght@800&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Ícones AUTO-HOSPEDADOS com subset (§1.4). Antes vinha do cdn.jsdelivr.net:
      folha render-blocking, de terceiro, puxando a família inteira (~131 KB de
      woff2 para ~2.000 glifos) para usar 107. Agora são 8,7 KB, na mesma
      origem — sem DNS+TLS extra no caminho crítico e sem depender da
      disponibilidade de um host que não é nosso.

      Gerado por `npm run icons:subset` e versionado. O teste
      `scripts/__tests__/icon-subset.test.js` falha se o código passar a usar um
      ícone fora do subset — sem ele, o `<i>` simplesmente ficaria em branco,
      sem erro em lugar nenhum.
    -->
    <link rel="stylesheet" href="/fonts/bootstrap-icons-subset.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
